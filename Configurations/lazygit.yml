promptToReturnFromSubprocess: false
notARepository: skip
os:
  edit: 'command -v code >/dev/null && code --reuse-window -- {{filename}} || nano {{filename}}'
  editAtLine: 'command -v code >/dev/null && code --reuse-window --goto -- {{filename}}:{{line}} || nano +{{line}} {{filename}}'
customCommands:
  - key: <c-d>
    context: "localBranches, remoteBranches"
    command: bash -ic "git_delete_old_branches"
    output: log
git:
  overrideGpg: true
